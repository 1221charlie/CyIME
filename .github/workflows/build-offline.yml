name: Build Offline APK (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk/2[0-8]* || true
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK (use the runner's preinstalled Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null || true
          set -o pipefail
          "$SDKM" --install "ndk;29.0.14206865"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build offline APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOffline --no-daemon --stacktrace

      - name: Locate arm64-v8a APK
        id: apk
        run: |
          echo "All APKs produced:"
          find app/build/outputs/apk -iname '*.apk'
          APK=$(find app/build/outputs/apk -iname '*.apk' | grep -i offline | grep -i arm64 | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No arm64 offline APK found, see the list above"; exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Using: $APK"

      - name: Restore signing key (kept in the Actions cache between runs)
        uses: actions/cache@v4
        with:
          path: ks.jks
          key: signing-keystore-v1

      - name: Sign APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          if "$BT/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "APK already signed."
          else
            if [ ! -f ks.jks ]; then
              keytool -genkeypair -keystore ks.jks -storepass cyime-local -keypass cyime-local \
                -alias cyime -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=CyIME"
            fi
            "$BT/zipalign" -f -p 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks ks.jks --ks-pass pass:cyime-local \
              --key-pass pass:cyime-local --ks-key-alias cyime --out signed.apk aligned.apk
            mv signed.apk "$APK"
            "$BT/apksigner" verify "$APK"
          fi

      - name: Verify no INTERNET permission
        run: |
          APK="${{ steps.apk.outputs.path }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::INTERNET permission is still present"; exit 1
          fi
          echo "ABI folders in this APK:"
          unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: cyime-offline-arm64-v8a
          path: ${{ steps.apk.outputs.path }}
