
name: Build CyIME Offline Full APK

on:
  workflow_dispatch:
  push:
    branches:
      - build-offline-full
    paths:
      - ".github/workflows/offline-full.yml"
      - "app/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

jobs:
  build-offline-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build Offline Full APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleOffline -PbundleModels=true --no-daemon --stacktrace

      - name: Verify ARM64 APK has no INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/offline -type f -name '*full*arm64-v8a.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "Full ARM64 Offline APK was not found."
            find app/build/outputs/apk -maxdepth 4 -type f -name '*.apk' -print || true
            exit 1
          fi
          APK_ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [[ ! -x "$APK_ANALYZER" ]]; then
            echo "apkanalyzer was not found."
            exit 1
          fi
          PERMISSIONS="$("$APK_ANALYZER" manifest permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          if grep -q "android.permission.INTERNET" <<< "$PERMISSIONS"; then
            echo "ERROR: INTERNET permission is present."
            exit 1
          fi
          echo "PASS: INTERNET permission is absent."

      - name: Upload Offline Full APK
        uses: actions/upload-artifact@v7
        with:
          name: CyIME-1.15.105-Offline-Full-arm64
          path: app/build/outputs/apk/offline/*full*arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
